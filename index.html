<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GamesLOL — clean, fast browser games</title>
  <meta name="description" content="A small, carefully made arcade: Snake, 2048, Blocks, Minesweeper, Brick Breaker and Tic-Tac-Toe. No ads, no sign-up.">
  <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('gameslol:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#/" aria-label="GamesLOL home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="8" height="8" rx="2.5" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="4" fill="currentColor" opacity=".55"/><rect x="3" y="13" width="8" height="8" rx="2.5" fill="currentColor" opacity=".55"/><rect x="13" y="13" width="8" height="8" rx="2.5" fill="currentColor"/></svg>
        </span>
        <span class="brand-name">games<span>lol</span></span>
      </a>
      <nav class="topnav">
        <a href="#/" class="topnav-link">Games</a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer container">
    <span>gameslol — made for fun. Scores are saved on this device only.</span>
    <span class="footer-keys"><kbd>R</kbd> restart · <kbd>P</kbd> pause · <kbd>/</kbd> search</span>
  </footer>

  <noscript><p class="container">GamesLOL needs JavaScript to run the games.</p></noscript>

  <script src="js/core.js"></script>
  <script src="js/games/snake.js"></script>
  <script src="js/games/2048.js"></script>
  <script src="js/games/blocks.js"></script>
  <script src="js/games/mines.js"></script>
  <script src="js/games/breaker.js"></script>
  <script src="js/games/tictactoe.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
